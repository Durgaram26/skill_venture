# Host nginx site for gencl11 + Certbot SSL
# Install on VPS (requires a domain — Let's Encrypt does not issue certs for bare IPs):
#
#   sudo cp deploy/host-nginx-gencl11.conf /etc/nginx/sites-available/gencl11
#   sudo ln -s /etc/nginx/sites-available/gencl11 /etc/nginx/sites-enabled/gencl11
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gencl11.yourdomain.com
#
# After HTTPS works, update /docker/gen_cl11/.env:
#   CLIENT_URL=https://gencl11.yourdomain.com
#   COOKIE_SECURE=true
# Then: docker compose -f docker-compose.hostinger.yml up -d --build frontend backend

server {
    listen 80;
    server_name gencl11.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Certbot will add a second server { listen 443 ssl; ... } block automatically.
