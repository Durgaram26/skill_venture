name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/skillventures_test
          REDIS_URL: redis://127.0.0.1:6379
          JWT_ACCESS_SECRET: ci-access-secret-min-32-chars-long!!
          JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-long!
          CLIENT_URL: http://localhost:5173
          COOKIE_SECURE: 'false'

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
