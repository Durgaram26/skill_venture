[build]
  base = "apps/client"
  command = """
    cd ../.. &&
    NODE_ENV=development npm ci &&
    npm run build -w @skillventures/shared-types &&
    npm run build -w @skillventures/client
  """
  publish = "dist"
  functions = "../../netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# Route all /api/* requests to the serverless Express function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback — must come after the API redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
